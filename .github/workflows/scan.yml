name: bist-scanner
on:
  schedule:
    - cron: "5 7-14 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: scan
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Tara
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CAPITAL: ${{ vars.CAPITAL }}
        run: python scanner.py
      - name: Durumu kaydet
        run: |
          git config user.name "bist-bot"
          git config user.email "bot@users.noreply.github.com"
          git add scan_state.json
          git diff --staged --quiet || git commit -m "scan"
          git pull --rebase
          git push
